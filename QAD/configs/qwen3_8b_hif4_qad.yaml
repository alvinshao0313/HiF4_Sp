# HiF4 × EdgeRazor QAD — Qwen3-8B（旧默认，保留对照）
# 当前 run_qad.sh 默认已切换到 Qwen3.5-27B，见 qwen3_5_27b_hif4_qad.yaml

model:
  model_path: Qwen/Qwen3-8B
  target_modules: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj
  hif4_group_size: 64
  trainable: s0_continuous_only

data:
  dataset_name: simplescaling/s1K-1.1_tokenized
  trace_source: deepseek
  model_max_length: 8192

loss:
  task_alpha: 0.05
  eakld_alpha: 2.0
  lafd_alpha: 0.5
  temperature: 1.0
  confidence_k: 16
  lafd_topk: 3

train:
  max_steps: 2000
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-5
  weight_decay: 0.001
  warmup_ratio: 0.05
  max_grad_norm: 1.3
  lr_scheduler_type: constant_with_warmup
  bf16: true
  gradient_checkpointing: true
