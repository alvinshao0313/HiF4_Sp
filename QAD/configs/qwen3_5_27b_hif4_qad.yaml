# HiF4 × EdgeRazor QAD — Qwen3.5-27B
# 混合架构：Linear Attention (Gated DeltaNet) + Full Attention + Dense MLP

model:
  model_path: Qwen/Qwen3.5-27B
  # Full Attn: q/k/v/o_proj；Linear Attn: in_proj_* / out_proj；MLP: gate/up/down
  target_modules: >-
    q_proj,k_proj,v_proj,o_proj,
    in_proj_qkv,in_proj_z,in_proj_a,in_proj_b,out_proj,
    gate_proj,up_proj,down_proj
  hif4_group_size: 64
  trainable: s0_continuous_only

data:
  dataset_name: simplescaling/s1K-1.1_tokenized
  trace_source: deepseek
  model_max_length: 32768
  allow_truncate: false

loss:
  task_alpha: 0.05
  eakld_alpha: 2.0
  lafd_alpha: 0.5
  temperature: 1.0
  confidence_k: 16
  lafd_topk: 3
  logit_chunk_size: 512

train:
  max_steps: 2000
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-5
  weight_decay: 0.001
  warmup_ratio: 0.05
  max_grad_norm: 1.3
  lr_scheduler_type: constant_with_warmup
  bf16: true
  gradient_checkpointing: true
  # 拟合实测：fsdp 在最长 S1K(~27k) OOM；默认 layer（按层 device_map）
  parallel_mode: layer
